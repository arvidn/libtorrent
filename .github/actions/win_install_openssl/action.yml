inputs:
  architecture:
    description: the architecture to install ("x64" or "x86")
    required: true
  linking:
    description: the linking type to install ("static" or "dynamic")
    required: true

runs:
  using: "composite"
  steps:
    # the runner image ships a 64-bit OpenSSL (the slproweb installer) in
    # C:\Program Files\OpenSSL. Its lib directory holds DLL import libraries,
    # the static libraries live in per-CRT subdirectories under names b2 does
    # not look for. Putting them in place of the import libraries lets every
    # workflow keep pointing at the same lib directory. MD matches b2's default
    # runtime-link=shared. There is no 32-bit OpenSSL on the image, so x86 is
    # built with vcpkg.
    - name: Use bundled OpenSSL
      if: inputs.architecture == 'x64' && inputs.linking == 'static'
      shell: pwsh
      run: |
        $Lib = "C:\Program Files\OpenSSL\lib"
        dir "$Lib\VC\x64\MD"
        Copy-Item "$Lib\VC\x64\MD\libcrypto_static.lib" "$Lib\libcrypto.lib" -Force
        Copy-Item "$Lib\VC\x64\MD\libssl_static.lib" "$Lib\libssl.lib" -Force
        # without the DLLs, an accidental dynamic link fails at test time
        # instead of passing silently
        Remove-Item "C:\Program Files\OpenSSL\bin" -Recurse -Force
    - name: Check vcpkg.json
      if: inputs.architecture == 'x86'
      shell: pwsh
      run: |
        $f = [System.IO.File]::Exists("tools\vcpkg.json")
        if (!$f){
          throw "Could not find 'tools/vcpkg.json'. Did you forget to checkout libtorrent?"
        }
    - name: Remove Default OpenSSL
      if: inputs.architecture == 'x86'
      shell: cmd
      run: |
        rmdir "C:\Program Files\OpenSSL\lib" /S /Q
        rmdir "C:\Program Files\OpenSSL\bin" /S /Q
    - name: Record runner image version
      if: inputs.architecture == 'x86'
      shell: pwsh
      run: echo "IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV
    # a hit in vcpkg's binary cache skips both the source download and the
    # build. The runner image version is part of the key because the package
    # ABI depends on the compiler and vcpkg revision it ships.
    - name: Cache vcpkg binaries
      if: inputs.architecture == 'x86'
      uses: actions/cache@v5
      id: cache-openssl
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: vcpkg-openssl-${{ inputs.architecture }}-${{ inputs.linking }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('tools/vcpkg.json') }}
        restore-keys: |
          vcpkg-openssl-${{ inputs.architecture }}-${{ inputs.linking }}-
    - name: Install OpenSSL with vcpkg
      if: inputs.architecture == 'x86'
      shell: pwsh
      run: |
        cd tools
        switch("${{ inputs.linking }}") {
          "dynamic" { $Linking = "" }
          default { $Linking = "-static" }
        }
        vcpkg install --triplet="${{ inputs.architecture }}-windows$Linking"
        New-Item -Path "C:\Program Files\OpenSSL\lib" -ItemType SymbolicLink -Value "C:\vcpkg\packages\openssl_${{ inputs.architecture }}-windows$Linking\lib\"
    - name: Check OpenSSL
      shell: pwsh
      run: |
        dir "C:\Program Files\OpenSSL\lib"
        $f1 = [System.IO.File]::Exists("C:\Program Files\OpenSSL\lib\libcrypto.lib")
        $f2 = [System.IO.File]::Exists("C:\Program Files\OpenSSL\lib\libssl.lib")
        if (!$f1 -or !$f2){
          throw "Failed to obtain required OpenSSL lib files."
        }
